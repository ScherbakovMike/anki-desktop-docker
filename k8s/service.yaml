apiVersion: v1
kind: Service
metadata:
  name: anki-desktop
  namespace: anki
  labels:
    app: anki-desktop
spec:
  type: ClusterIP
  selector:
    app: anki-desktop
  ports:
    - name: web
      port: 3000
      targetPort: web
    - name: ankiconnect
      port: 8765
      targetPort: ankiconnect
