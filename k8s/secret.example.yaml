# Copy to secret.yaml and fill in real values (do NOT commit the filled copy).
#   kubectl -n anki create secret generic anki-ankiweb \
#     --from-literal=ANKI_USERNAME='you@example.com' \
#     --from-literal=ANKI_PASSWORD='your-password'
apiVersion: v1
kind: Secret
metadata:
  name: anki-ankiweb
  namespace: anki
type: Opaque
stringData:
  ANKI_USERNAME: "you@example.com"
  ANKI_PASSWORD: "change-me"
