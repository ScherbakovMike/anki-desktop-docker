apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-desktop
  namespace: anki
  labels:
    app: anki-desktop
spec:
  replicas: 1
  # Single instance only: Anki locks the collection. Recreate avoids overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anki-desktop
  template:
    metadata:
      labels:
        app: anki-desktop
    spec:
      containers:
        - name: anki-desktop
          # Pin to an explicit version tag in production instead of :latest.
          image: mikescherbakov/anki-desktop-docker:latest
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 3000
            - name: ankiconnect
              containerPort: 8765
          env:
            # /config ownership (linuxserver base).
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            # Seconds between automatic syncs (0 disables); see anki-autosync.
            - name: ANKI_SYNC_INTERVAL
              value: "300"
          envFrom:
            # AnkiWeb credentials, consumed by the anki-autosync add-on.
            - secretRef:
                name: anki-ankiweb
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            # AnkiConnect listens once Anki has launched.
            tcpSocket:
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: anki-config
